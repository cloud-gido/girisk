# GiRisk 本地依赖栈（对齐 GIDO / 平台镜像）
#   docker compose up -d                         # PostgreSQL 16 + Kafka + Redis 7
#   docker compose --profile doris up -d         # + Doris FE/BE + 审计 Routine Load
#   docker compose --profile full up -d --build  # + Console 容器
#
# 镜像与家族一致：
#   postgres:16-alpine（GIDO）· redis:7.0-alpine（platform internal-redis）
#   apache/kafka:3.9.0 · apache/doris:fe-ubuntu-2.1.7 · deploy-doris-be/init

services:
  postgres:
    image: postgres:16-alpine
    container_name: girisk-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-girisk}
      POSTGRES_USER: ${POSTGRES_USER:-girisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-girisk}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - girisk_pg_data:/var/lib/postgresql/data

  kafka:
    # 与 giso 同镜像；INTERNAL 供 Doris Routine Load，EXTERNAL 供宿主机 Console
    image: apache/kafka:3.9.0
    hostname: kafka
    container_name: girisk-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 25s

  redis:
    # 与 deployment/apps/platform/internal-redis 一致
    image: redis:7.0-alpine
    container_name: girisk-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  girisk:
    profiles: ["full"]
    image: ${GIRISK_IMAGE_REGISTRY:-girisk}/girisk-console:${GIRISK_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.console
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9-eclipse-temurin-21}
        JRE_IMAGE: ${JRE_IMAGE:-eclipse-temurin:21-jre-alpine}
    ports:
      - "${GIRISK_PORT:-18088}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: postgres,realtime
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/girisk
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: girisk
      SPRING_DATASOURCE_PASSWORD: girisk
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_ENABLED: "true"
      REDIS_ENABLED: "true"
      GIRISK_AUDIT_DORIS_ENABLED: "true"
      GIRISK_AUDIT_DORIS_JDBC_URL: jdbc:mysql://doris-fe:9030/girisk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      GIRISK_AUDIT_DORIS_USERNAME: root
      GIRISK_AUDIT_DORIS_PASSWORD: ""
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Doris（profile: doris）复用 giso 本地镜像，不重新 build BE ──
  doris-fe:
    profiles: [doris]
    image: apache/doris:fe-ubuntu-2.1.7
    container_name: girisk-doris-fe
    hostname: doris-fe
    environment:
      FE_SERVERS: fe1:172.28.0.2:9010
      FE_ID: 1
    ports:
      - "8030:8030"
      - "9030:9030"
    volumes:
      - girisk_doris_fe_data:/opt/apache-doris/fe/doris-meta
    networks:
      default: {}
      doris-net:
        ipv4_address: 172.28.0.2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/api/health"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  doris-be:
    profiles: [doris]
    # giso `deploy` 工程已构建的 patched BE（跳过 ulimit exit）
    image: deploy-doris-be:latest
    container_name: girisk-doris-be
    hostname: doris-be
    privileged: true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655350
        hard: 655350
    environment:
      FE_SERVERS: fe1:172.28.0.2:9010
      BE_ADDR: 172.28.0.3:9050
      BE_HEARTBEAT_PORT: 9050
      SKIP_CHECK_ULIMIT: "true"
    ports:
      - "8040:8040"
    volumes:
      - girisk_doris_be_data:/opt/apache-doris/be/storage
    depends_on:
      doris-fe:
        condition: service_healthy
    networks:
      default: {}
      doris-net:
        ipv4_address: 172.28.0.3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8040/api/health"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 1200s
    restart: unless-stopped

  doris-init:
    profiles: [doris]
    # 复用 giso init 镜像（mysql client），挂载本仓 init.sh + SQL
    image: deploy-doris-init:latest
    container_name: girisk-doris-init
    environment:
      DORIS_FE_HOST: doris-fe
      DORIS_FE_PORT: "9030"
      DORIS_BE_IP: 172.28.0.3
      DORIS_BE_WAIT_MAX: "360"
      DORIS_BE_STABLE_ROUNDS: "24"
    volumes:
      - ./deploy/doris/init.sh:/init.sh:ro
      - ./doris/01_create_tables.sql:/sql/01_create_tables.sql:ro
      - ./deploy/doris/02_routine_load.docker.sql:/sql/02_routine_load.docker.sql:ro
    entrypoint: ["/bin/bash", "/init.sh"]
    depends_on:
      doris-fe:
        condition: service_healthy
      doris-be:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: "no"

volumes:
  girisk_pg_data:
  girisk_doris_fe_data:
  girisk_doris_be_data:

networks:
  doris-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
