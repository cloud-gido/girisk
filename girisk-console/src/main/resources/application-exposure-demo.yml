# H2 + Redis：本地敞口回放演示（读 girisk:view:*），关 Kafka
spring:
  datasource:
    url: jdbc:h2:mem:girisk;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3s

girisk:
  redis:
    enabled: true
  kafka:
    enabled: false
  demo:
    auto-seed: true
    classpath-prefix: demo/germany-paraguay
  sports:
    online-decide-enabled: true
    seed-payout-yuan: 5000
    max-worst-loss-yuan: 200000
    default-delta: 0.2
  tenant:
    enforce: false
